const JST_OFFSET = 9 * 60; // minutes
const jstToday = (() => {
  const now = new Date();
  const jst = new Date(now.getTime() + (JST_OFFSET + now.getTimezoneOffset()) * 60000);
  return `${jst.getFullYear()}-${String(jst.getMonth()+1).padStart(2,'0')}-${String(jst.getDate()).padStart(2,'0')}`;
})();

const fixHour12 = t => {
  const m = /^(\d{1,2}):(\d{2})$/.exec((t||'').trim());
  if (!m) return t;
  let h = Number(m[1]);
  if (h >= 1 && h <= 11) h += 12;
  return `${h}:${m[2]}`;
};

function normalizeEvents(list){
  return list.map(e => {
    const out = { image: null, media: [], ...e };
    if (e.venueId === 'barbarbar') {
      const sym = (out.artist || '').trim().charAt(0);
      if (BBB_MC[sym]) out.price = `MC ${BBB_MC[sym]}（別途TC550円）`;
    }
    out.artist = cleanArtist(out.artist);
    if (e.venueId === 'bluenote') { out.open = fixHour12(out.open); out.start = fixHour12(out.start); }
    return out;
  }).filter(e => e.artist.length > 0)
    .sort((a, b) => a.date.localeCompare(b.date) || a.venueId.localeCompare(b.venueId) || String(a.start).localeCompare(String(b.start)));
}

const addDays = (iso, n) => {
  const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n);

};
const jstDow = iso => new Date(`${iso}T00:00:00Z`).getUTCDay();
const matchesRange = iso => {
  if (state.range === 'all') return true;

};

/* CORSプロキシ経由で各会場を取得する。失敗しても埋め込み済みデータは保持される。 */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
];

const MONTH_NOW = Number(jstToday.slice(5, 7));
const YEAR_NOW = Number(jstToday.slice(0, 4));
const NEXT_M = MONTH_NOW === 12 ? 1 : MONTH_NOW + 1;
const NEXT_Y = MONTH_NOW === 12 ? YEAR_NOW + 1 : YEAR_NOW;
const MONTHS = [{ y: YEAR_NOW, m: MONTH_NOW }, { y: NEXT_Y, m: NEXT_M }];
const pad2 = n => String(n).padStart(2, '0');
const isoOf = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const resolveDate = (mo, da) => {
  for (const { y, m } of MONTHS) if (m === Number(mo)) return isoOf(y, m, Number(da));
  return null;
};
const strip = s => (s || '')
  .replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ')
  .replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ' ')
  .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&times;/g, '×')
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#0?39;/g, "'")
  .replace(/\s+/g, ' ').trim();
const CONFIRM = '公式で確認';
const grabTime = (t, kw) => {
  // 「open 18:30」「18:30open」「OPEN18：30」いずれの語順にも対応
  const m = new RegExp(`(?:${kw})\\D{0,4}(\\d{1,2})[:：](\\d{2})|(\\d{1,2})[:：](\\d{2})\\s*(?:${kw})`, 'i').exec(t || '');
  if (!m) return CONFIRM;
  return m[1] ? `${Number(m[1])}:${m[2]}` : `${Number(m[3])}:${m[4]}`;
};
const openOf = t => grabTime(t, 'open|開場');
const startOf = t => grabTime(t, 'start|開演');
const priceOf = t => { const m = /(?:[¥￥]\s?[\d,]{3,}|[\d,]{3,}\s?円)/.exec(t); return m ? m[0].replace(/\s/g, '') : CONFIRM; };
const abs = (href, base) => { try { return new URL(href, base).href; } catch { return href; } };

async function fetchVia(url) {
  let lastErr;
  for (const wrap of PROXIES) {
    try {
      const res = await fetch(wrap(url), { headers: { 'Accept': 'text/html' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const head = new TextDecoder('latin1').decode(buf.slice(0, 2048));
      const cs = /charset=["']?([\w-]+)/i.exec(head)?.[1] || 'utf-8';
      const enc = /shift[_-]?jis|sjis|windows-31j/i.test(cs) ? 'shift_jis'
        : /euc-?jp/i.test(cs) ? 'euc-jp' : 'utf-8';
      let text;
      try { text = new TextDecoder(enc).decode(buf); }
      catch { text = new TextDecoder('utf-8').decode(buf); }
      if (text.length < 200) throw new Error('内容が空');
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('全プロキシ失敗');
}

function parseReserve(origin) {
  const to24 = t => { const x = /^(\d{1,2}):(\d{2})$/.exec(t); if (!x) return t; let h = +x[1]; if (h >= 1 && h <= 11) h += 12; return `${h}:${x[2]}`; };
  return (html, ctx) => {
    const out = []; const re = /<a[^>]+href=["']([^"']*\/reserve\/schedule\/exec\/\d+)["'][^>]*>([\s\S]{0,900}?)<\/a>/gi; let m;
    while ((m = re.exec(html))) {
      const block = m[2], text = strip(block);
      const dm = /(\d{1,2})[\/月](\d{1,2})/.exec(text); if (!dm) continue;
      const date = resolveDate(dm[1], dm[2]) || isoOf(ctx.y, ctx.m, dm[2]);
      const img = /<img[^>]+src=["']([^"']+event\/\d+\.jpe?g[^"']*)["']/i.exec(block);
      out.push({ date, open: to24(openOf(text)), start: to24(startOf(text)),
        artist: text.replace(/\d{1,2}[\/月]\d{1,2}日?\s*[（(].?[）)]?/, '').trim().slice(0, 200),
        price: priceOf(text), image: img ? abs(img[1], origin) : null, source: abs(m[1], origin) });
    }
    return out;
  };
}

const PARSERS = {
  dolphy: {
    urls: (y, m) => (m === MONTH_NOW
      ? ['https://dolphy-jazzspot.com/live_schedule.html']
      : [`https://dolphy-jazzspot.com/live_schedule${y}_${m}.html`]),
    parse(html, ctx) {
      // 実際の表記は「8/23(日) 13:00open 13:30start 出演者 前4000円/当4500円」
      const out = [];
      for (const row of html.split(/<tr[^>]*>/i).slice(1)) {
        const text = strip(row);
        const dm = /^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*[（(]/.exec(text);
        if (!dm) continue;
        const date = resolveDate(dm[1], dm[2]);
        if (!date) continue;
        let rest = text.slice(dm[0].length).replace(/^[^）)]*[）)]/, '');
        rest = rest.replace(/\d{1,2}[:：]\d{2}\s*(?:open|start)/gi, ' ').trim();
        const pm = /(?:前|当|チャージ)[^\s]*?[\d,]{3,}\s*円[^\s]*/.exec(rest);
        const artist = (pm ? rest.slice(0, pm.index) : rest).replace(/\s+/g, ' ').trim();
        if (!artist || /^(休演|休み|CLOSE)/.test(artist)) continue;
        out.push({
          date,
          open: grabTime(text, 'open|開場'),
          start: grabTime(text, 'start|開演'),
          artist: artist.slice(0, 200),
          price: pm ? pm[0] : priceOf(text),
          image: null,
          source: ctx.url,
        });
      }
      return out;
    },
  },
  barbarbar: {
    urls: (y, m) => [`https://www.barbarbar.jp/calendar.php?year=${y}&month=${m}`],
    parse(html, ctx) {
      const out = []; const cells = html.split(/<td[^>]*>/i).slice(1);
      for (const cell of cells) {
        const dm = /^\s*(?:<[^>]+>\s*)*(\d{1,2})\b/.exec(cell); if (!dm) continue;
        const img = /<img[^>]+src=["']([^"']*uploads\/[^"']+)["']/i.exec(cell);
        const text = strip(cell.replace(/^\s*(?:<[^>]+>\s*)*\d{1,2}/, '')); if (!text) continue;
        out.push({ date: isoOf(ctx.y, ctx.m, dm[1]), open: openOf(text), start: startOf(text), artist: text.slice(0, 160), price: priceOf(text), image: img ? abs(img[1], 'https://www.barbarbar.jp/calendar/') : null, source: ctx.url });
      }
      return out;
    },
  },
  bluenote: { urls: (y, m) => [`https://reserve.bluenote.co.jp/reserve/schedule/move/${y}${pad2(m)}/`], parse: parseReserve('https://reserve.bluenote.co.jp') },
  cottonclub: { urls: (y, m) => [`https://reserve.cottonclubjapan.co.jp/reserve/schedule/move/${y}${pad2(m)}/`], parse: parseReserve('https://reserve.cottonclubjapan.co.jp') },
  swing: {
    // サイトは http:// 提供。記事URLの日付は当てにならない（8/28の公演が20260831というURL）ため
    // 一覧に表示される「2026/08/28」を正とする。
    urls: (y, m) => [`http://ginzaswing.jp/schedules/?month=${y}-${pad2(m)}`],
    parse(html) {
      const out = [];
      const re = /<h2[^>]*>\s*<a[^>]+href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>[\s\S]{0,600}?(\d{4})\/(\d{2})\/(\d{2})([\s\S]{0,400}?)(?=<h2|$)/gi;
      let m;
      while ((m = re.exec(html))) {
        const title = strip(m[2]);
        if (!title || /スケジュール表|お知らせ/.test(title)) continue;   // News投稿を除外
        const body = strip(m[6]);
        const artist = title.replace(/^\s*\d{1,2}[.．]\s*[０-９\d]{1,2}\s*[（(].?[）)]\s*/, '').trim();
        if (!artist) continue;
        const st = grabTime(body, 'start|開演|1st');
        out.push({
          date: `${m[3]}-${m[4]}-${m[5]}`,
          open: grabTime(body, 'open|開場'),
          start: st,
          artist: artist.slice(0, 200),
          price: priceOf(body),
          image: null,
          source: m[1],
        });
      }
      return out;
    },
  },
  kanmachi63: {
    urls: (y, m) => (m === MONTH_NOW ? ['https://kanmachi63.blog.fc2.com/'] : []),
    parse(html) {
      const out = []; const text = strip(html);
      const re = /(\d{1,2})月(\d{1,2})日\s*[（(].?[）)]([^]{0,120}?)(?=\d{1,2}月\d{1,2}日\s*[（(]|$)/g; let m;
      while ((m = re.exec(text))) {
        const date = resolveDate(m[1], m[2]); if (!date) continue;
        const artist = m[3].replace(/^\s*nd\s*\d{1,2}:\d{2}[～~]?\s*/, '').trim(); if (!artist) continue;
        out.push({ date, open: '14:30', start: '15:00', artist: artist.slice(0, 160), price: '¥3,300', image: null, source: 'https://kanmachi63.blog.fc2.com/' });
      }
      return out;
    },
  },
  kingsbar: {
    urls: (y, m) => [`https://livebar.net/kingsbar/schedule?year=${y}&month=${m}`],
    parse(html) {
      const out = []; const re = /<a[^>]+href=["']([^"']*\/events\/\d+)["'][^>]*>([\s\S]{0,500}?)<\/a>/gi; let m;
      while ((m = re.exec(html))) {
        const text = strip(m[2]); const dm = /(\d{1,2})[\/月](\d{1,2})/.exec(text); if (!dm) continue;
        const date = resolveDate(dm[1], dm[2]); if (!date) continue;
        out.push({ date, open: openOf(text), start: startOf(text), artist: text.replace(/\d{1,2}[\/月]\d{1,2}日?/, '').trim().slice(0, 160), price: priceOf(text), image: null, source: abs(m[1], 'https://livebar.net/kingsbar/') });
      }
      return out;
    },
  },
  first: {
    urls: (y, m) => (m === MONTH_NOW ? ['https://naniaru.com/places/view/first'] : []),
    parse(html) {
      const out = []; const re = /<a[^>]+href=["'](\/events\/view\/\d+)["'][^>]*>([\s\S]{0,500}?)<\/a>/gi; let m;
      while ((m = re.exec(html))) {
        const text = strip(m[2]); const dm = /(\d{1,2})[\/月](\d{1,2})/.exec(text); if (!dm) continue;
        const date = resolveDate(dm[1], dm[2]); if (!date) continue;
        out.push({ date, open: openOf(text), start: startOf(text), artist: text.replace(/\d{1,2}[\/月]\d{1,2}日?/, '').trim().slice(0, 160), price: priceOf(text), image: null, source: abs(m[1], 'https://naniaru.com') });
      }
      return out;
    },
  },
  wonderwall: {
    urls: (y, m) => (m === MONTH_NOW ? ['https://wonderwall-yokohama.jp/calendar/'] : []),
    parse(html) {
      const out = []; const text = strip(html);
      const re = /(\d{4})[.\/年-](\d{1,2})[.\/月-](\d{1,2})日?([^]{0,300}?)(?=\d{4}[.\/年-]\d{1,2}[.\/月-]\d{1,2}|$)/g; let m;
      while ((m = re.exec(text))) {
        const body = m[4].trim(); if (!body) continue;
        out.push({ date: isoOf(m[1], m[2], m[3]), open: openOf(body), start: startOf(body), artist: body.slice(0, 160), price: priceOf(body), image: null, source: 'https://wonderwall-yokohama.jp/calendar/' });
      }
      return out;
    },
  },
};

const progressEl = document.querySelector('#progress');
const logLine = (html) => { progressEl.insertAdjacentHTML('beforeend', `<div>${html}</div>`); progressEl.scrollTop = progressEl.scrollHeight; };

async function refreshAll(btn) {
  progressEl.hidden = false;
  progressEl.innerHTML = '<b>取得中…（1〜2分かかります）</b>';
  btn.disabled = true; btn.textContent = '取得中…';
  const events = []; const reports = [];

  for (const v of data.venues) {
    const p = PARSERS[v.id];
    if (!p) { logLine(`<span class="ng">－</span> ${v.name}：自動取得対象外（${v.status || '取得元なし'}）`); continue; }
    for (const { y, m } of MONTHS) {
      for (const url of p.urls(y, m)) {
        try {
          const html = await fetchVia(url);
          const rows = p.parse(html, { y, m, url });
          const seen = new Set();
          for (const r of rows) {
            if (!r.date || !r.artist) continue;
            const k = `${v.id}|${r.date}|${r.artist}`;
            if (seen.has(k)) continue;
            seen.add(k);
            events.push({ venueId: v.id, media: [], ...r });
          }
          reports.push({ id: `${v.id}-${y}${pad2(m)}`, venueId: v.id, url, status: 'ok', count: seen.size, bytes: html.length });
          logLine(`<span class="ok">✓</span> ${v.name} ${y}/${pad2(m)} → ${seen.size}件`);
        } catch (e) {
          reports.push({ id: `${v.id}-${y}${pad2(m)}`, venueId: v.id, url, status: 'error', count: 0, bytes: 0, error: String(e.message || e) });
          logLine(`<span class="ng">✗</span> ${v.name} ${y}/${pad2(m)} → 失敗（${e.message || e}）`);
        }
      }
    }
  }

  const ok = reports.filter(r => r.status === 'ok').length;
  if (!events.length) {
    logLine(`<b class="ng">取得できませんでした。埋め込み済みのデータを表示しています。</b>`);
  } else {
    const seen = new Set();
    const deduped = events.filter(e => { const k = `${e.venueId}|${e.date}|${e.artist}`; if (seen.has(k)) return false; seen.add(k); return true; })
                          .filter(e => e.date >= jstToday);
    data.events = normalizeEvents(deduped);
    data.crawlReports = reports;
    data.updatedAt = new Date().toISOString();
    for (const v of data.venues) {
      const n = data.events.filter(e => e.venueId === v.id).length;
      const rs = reports.filter(r => r.venueId === v.id);
      if (rs.length) v.status = rs.some(r => r.status === 'error') ? '取得エラーあり' : (n ? `公式日程あり（${n}件）` : '取得できたが公演0件');
    }
    rebuildCrawlIndex();
    try { localStorage.setItem('jazzData', JSON.stringify(data)); } catch (e) {}
    logLine(`<b class="ok">完了：${data.events.length}件（成功 ${ok}ページ）</b>`);
    renderEvents(); renderVenues(); renderCrawl(); renderUpdatedAt();
  }
  btn.disabled = false; btn.textContent = '最新を取得';
}

function renderUpdatedAt() {
  const d = new Date(data.updatedAt);
  const ageDays = (Date.now() - d.getTime()) / 864e5;
  document.querySelector('#updatedAt').innerHTML =
    `情報更新 ${new Intl.DateTimeFormat('ja-JP', { dateStyle: 'medium' }).format(d)}` +
    (ageDays > 3 ? ' <span style="color:var(--red)">（古い可能性あり・「最新を取得」を押してください）</span>' : '');
}

// 保存済みデータがあれば復元
try {
  const saved = localStorage.getItem('jazzData');
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && Array.isArray(parsed.events) && parsed.events.length && parsed.updatedAt > data.updatedAt) {
      data.events = normalizeEvents(parsed.events);
      data.venues = parsed.venues || data.venues;
      data.crawlReports = parsed.crawlReports || data.crawlReports;
      data.updatedAt = parsed.updatedAt;
      rebuildCrawlIndex();
    }
  }
} catch (e) {}

async function loadPublishedData(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '読込中…'; }
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const latest = await res.json();
    if (!latest || !Array.isArray(latest.events)) throw new Error('データ形式エラー');
    data.events = normalizeEvents(latest.events);
    data.crawlReports = latest.crawlReports || [];
    data.updatedAt = latest.updatedAt || data.updatedAt;
    rebuildCrawlIndex();
    renderEvents(); renderVenues(); renderCrawl(); renderUpdatedAt();
  } catch (e) {
    progressEl.hidden = false;
    progressEl.innerHTML = '<b class="ng">公開データを読み込めませんでした。内蔵データを表示します。</b>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '公開データを再読込'; }
  }
}
document.querySelector('#refreshButton').addEventListener('click', e => loadPublishedData(e.currentTarget));

renderEvents();renderVenues();renderCrawl();renderUpdatedAt();
loadPublishedData();

  </script>
